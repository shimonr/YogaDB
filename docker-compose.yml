services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/data
      - db:/app/db
    environment:
      # Keep the SQLite file in a named volume; a bind-mounted file that doesn't exist yet
      # would be created as a directory.
      DATABASE_URL: sqlite:////app/db/yogadb.db
      ASANAS_IMAGES_DIR: /data/asanas
      ASANAS_CSV_PATH: /data/asanas/yoga_asanas.sample.csv
      CORS_ORIGINS: http://localhost:4173

  frontend:
    build:
      context: ./frontend
      args:
        # nginx proxies /api to the backend, so the browser talks to one origin.
        VITE_API_BASE_URL: /api
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  db:
