# YogaDB stack on the Oracle VM, used for production (project "yogadb") and QA ("yogadb-qa").
# Started by server-deploy.sh with -p <project> --env-file .env; the env file holds DOMAIN,
# SECRET_KEY, POSTGRES_PASSWORD, ADMIN_PASSWORD, APP_VERSION, APP_COMMIT and BACKUP_DIR.
name: yogadb

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yogadb
      POSTGRES_USER: yogadb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yogadb", "-d", "yogadb"]
      interval: 5s
      retries: 30
    networks:
      - internal

  backend:
    build: ../../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DEBUG: "false"
      APP_VERSION: ${APP_VERSION:-dev}
      APP_COMMIT: ${APP_COMMIT:-}
      DATABASE_URL: postgresql://yogadb:${POSTGRES_PASSWORD}@db:5432/yogadb
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # Real data uploaded by upload-photos.cmd lives in /opt/apps/yogadb-data/asanas;
      # server-deploy.sh / server-import-photos.sh set these, otherwise the repo sample is used.
      ASANAS_CSV_PATH: /data/asanas/${ASANAS_CSV_FILE:-yoga_asanas.sample.csv}
      ASANAS_IMAGES_DIR: /data/asanas
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      QA_MODE: ${QA_MODE:-false}
      # Outgoing email for password reset links (QA uses the Mailpit test mailbox below).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-YogaDB <no-reply@yogadb.local>}
      SMTP_TLS: ${SMTP_TLS:-true}
    volumes:
      - ${ASANAS_DATA_DIR:-../../data/asanas}:/data/asanas:ro
      - uploads:/data/uploads   # user photo uploads (Cloudinary is used instead if configured)
    networks:
      - internal

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      caddy: ${DOMAIN:?set DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - internal
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    # Daily database dump and user-uploaded photos, 14 days kept, in BACKUP_DIR on the host
    # (/opt/backups/<project>). Imported asana images are not copied: their source is the uploader's PC.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          day=$$(date +%F)
          pg_dump -h db -U yogadb yogadb | gzip > /backups/yogadb-$$day.sql.gz
          tar -czf /backups/uploads-$$day.tar.gz -C /uploads .
          find /backups -name 'yogadb-*.sql.gz' -mtime +14 -delete
          find /backups -name 'uploads-*.tar.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ${BACKUP_DIR:-/opt/backups/yogadb}:/backups
      - uploads:/uploads:ro
    networks:
      - internal

  backup-offsite:
    # Copies /backups to Cloudinary (private) when BACKUP_CLOUDINARY_* are set; idles otherwise.
    build: ../../backend
    restart: unless-stopped
    command: ["python", "-m", "app.services.offsite_backup"]
    environment:
      BACKUP_LABEL: ${BACKUP_LABEL:-yogadb}
      BACKUP_CLOUDINARY_CLOUD_NAME: ${BACKUP_CLOUDINARY_CLOUD_NAME:-}
      BACKUP_CLOUDINARY_API_KEY: ${BACKUP_CLOUDINARY_API_KEY:-}
      BACKUP_CLOUDINARY_API_SECRET: ${BACKUP_CLOUDINARY_API_SECRET:-}
    volumes:
      - ${BACKUP_DIR:-/opt/backups/yogadb}:/backups:ro
    networks:
      - internal

  mailpit:
    # QA only (profile "mail"): catches every email the app sends; web inbox at MAIL_DOMAIN.
    image: axllent/mailpit:v1.31
    profiles: ["mail"]
    restart: unless-stopped
    environment:
      MP_UI_AUTH: qa:${MAILPIT_PASSWORD:-change-me}
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"
    labels:
      caddy: ${MAIL_DOMAIN:-mail.localhost}
      caddy.reverse_proxy: "{{upstreams 8025}}"
    networks:
      - internal
      - web

networks:
  internal: {}
  web:
    external: true

volumes:
  pgdata:
  uploads:
