name: Uptime

# Checks the production site every 30 minutes. A failed run makes GitHub email the repository
# owner (Settings > Notifications > Actions controls this).
on:
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs at busy times such as :00 and :30.
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Production responds
        run: |
          url=https://yogadb.129-159-8-242.sslip.io
          for path in /api/health / "/api/asanas?limit=1"; do
            curl -fsS --retry 3 --retry-delay 20 --max-time 20 -o /dev/null "$url$path" || { echo "::error::$url$path is down"; exit 1; }
          done
          curl -fsS "$url/api/health"
